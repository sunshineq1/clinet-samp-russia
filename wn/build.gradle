plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.joom.paranoid'
    id 'org.jetbrains.kotlin.android'
}

def properties = new Properties()
properties.load(project.rootProject.file('local.properties').newInputStream())
def apiKey = properties['API_KEY'] ?: ""

android {
    signingConfigs {
        debug {
            storeFile file('key/fuss.jks')
            storePassword '123123'
            keyAlias 'key0'
            keyPassword '123123'
        }
        release {
            storeFile file('key/fuss.jks')
            storePassword '123123'
            keyAlias 'key0'
            keyPassword '123123'
        }

    }
    compileSdkVersion 36
    namespace 'com.wn.blackrussia'

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        applicationId "com.wn.blackrussia"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 16
        versionName "1.6.2"

        multiDexEnabled true

        ndk {
            // abiFilters 'armeabi-v7a'
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    packagingOptions {
        jniLibs {
            excludes += ['META-INF/*']
        }
        resources {
            excludes += ['META-INF/*']
        }
    }

    ndkVersion '28.0.13004108'
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    // https://onlinehashtools.com/generate-random-md5-hash
    buildTypes {
        debug {
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                strippedNativeLibsDir 'build/intermediates/stripped_native_libs/release/out/lib'
                unstrippedNativeLibsDir 'build/intermediates/merged_native_libs/release/out/lib'
            }

            buildConfigField "String", "API", "\"" + apiKey + "\""

            debuggable false
            jniDebuggable false
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        release {
            firebaseCrashlytics {
                nativeSymbolUploadEnabled true
                strippedNativeLibsDir 'build/intermediates/stripped_native_libs/release/out/lib'
                unstrippedNativeLibsDir 'build/intermediates/merged_native_libs/release/out/lib'
            }

            buildConfigField "String", "API", "\"" + apiKey + "\""

            debuggable true
            jniDebuggable true
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }
    buildFeatures {
        viewBinding true
        buildConfig true
        prefab true
    }
    dataBinding {
        enabled = true
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "wn" + "_" +  "reBR" + "_" + versionName + ".apk"
        }
    }

    namespace 'com.wn.blackrussia'
}

dependencies {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if ('org.hamcrest' == details.requested.group && 'hamcrest-core' == details.requested.name) {
                details.useVersion('1.3')
            }
        }
    }
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'com.google.firebase:firebase-database:22.0.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.android.support:recyclerview-v7:28.0.0'
    implementation "androidx.constraintlayout:constraintlayout:2.1.2"
    implementation 'androidx.constraintlayout:constraintlayout-core:1.0.3'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'nl.dionsegijn:konfetti-xml:2.0.5'
    implementation "org.jetbrains.kotlin:kotlin-reflect"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
    implementation "org.jetbrains.kotlin:kotlin-reflect"
    implementation 'com.android.support:multidex:1.0.3'

    implementation 'org.ini4j:ini4j:0.5.4'

    implementation 'com.bytedance.android:shadowhook:1.0.10'
    implementation 'com.airbnb.android:lottie:6.4.0'
    implementation 'com.github.rommansabbir:AnimationX:2.0'
    implementation 'nl.dionsegijn:konfetti-xml:2.0.2'
    implementation "org.jetbrains.kotlin:kotlin-reflect"

    implementation 'com.github.smarteist:Android-Image-Slider:1.4.0'

    implementation 'com.google.android.material:material:1.12.0'
    implementation group: 'org.ini4j', name: 'ini4j', version: '0.5.4'
    implementation "com.github.skydoves:progressview:1.1.3"
    implementation 'com.github.Triggertrap:SeekArc:v1.1'
    implementation 'com.akexorcist:round-corner-progress-bar:2.1.2'
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.github.bumptech.glide:glide:4.13.2'

    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.0'

    // .. crashlytics
    implementation platform('com.google.firebase:firebase-bom:33.4.0')
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-crashlytics-ndk'
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'

    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.github.dangiashish:Auto-Image-Slider:1.0.6'
    implementation 'com.github.valkriaine:Bouncy:2.3'

    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.0'
    implementation "com.github.skydoves:colorpickerview:2.2.4"
    apply plugin: 'com.google.gms.google-services'

    implementation 'com.mikhaellopez:circularprogressbar:3.1.0'

    implementation("androidx.credentials:credentials:1.2.2")
    implementation("androidx.credentials:credentials-play-services-auth:1.2.2")

    implementation("com.google.android.libraries.identity.googleid:googleid:1.1.0")
    implementation("com.google.android.gms:play-services-auth:21.3.0")

    implementation("com.google.android.recaptcha:recaptcha:18.7.0")

    apply plugin: 'com.google.gms.google-services'
    implementation("com.google.android.play:app-update:2.1.0")
    implementation("com.google.android.play:app-update-ktx:2.1.0")

    implementation 'com.github.amitshekhariitbhu:PRDownloader:1.0.2'
    implementation "com.squareup.okhttp3:okhttp"

    implementation 'com.intuit.sdp:sdp-android:1.1.1'

    implementation 'com.github.ibrahimsn98:CirclesLoadingView:1.0'

    implementation "com.joom.paranoid:paranoid-gradle-plugin:0.3.14"

    implementation 'commons-codec:commons-codec:1.15'

    implementation "io.reactivex.rxjava2:rxandroid:2.1.1"

    implementation 'com.google.code.gson:gson:2.8.9'

    implementation 'com.github.jamesnguyenhub:mkloader:1.4.0'
}